<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MenuPlanner demo</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MenuPlanner.Demo.styles.css" />
    <style>
        .mp-loading { font-family: Roboto, system-ui, sans-serif; display: grid; place-items: center; height: 100vh; color: #555; }
    </style>
</head>
<body>
    <div id="app"><div class="mp-loading">Loading the MenuPlanner demo…</div></div>
    <div id="blazor-error-ui" style="display:none">Something went wrong. <a href="" class="reload">Reload</a></div>
    <script>
        window.mpTheme = {
            get: () => { try { return localStorage.getItem("mp.theme"); } catch { return null; } },
            set: v => { try { localStorage.setItem("mp.theme", v); } catch { } }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
